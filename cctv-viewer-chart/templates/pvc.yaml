{{- if and .Values.persistence.data.enabled .Values.global.persistence.enabled }}
# 1. CCTV Viewer Data (ReadWriteOnce - EBS)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cctv-viewer.fullname" . }}-data
  labels:
    {{- include "cctv-viewer.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  storageClassName: {{ .Values.persistence.data.storageClass | default .Values.global.storageClass }}
{{- end }}
---
{{- if and .Values.persistence.logs.enabled .Values.global.persistence.enabled }}
# 2. CCTV Viewer Logs (ReadWriteOnce - EBS)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cctv-viewer.fullname" . }}-logs
  labels:
    {{- include "cctv-viewer.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.logs.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}
  storageClassName: {{ .Values.persistence.logs.storageClass | default .Values.global.storageClass }}
{{- end }}
